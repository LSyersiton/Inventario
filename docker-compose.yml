services:
  backend:
    container_name: inventario
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=5432SE#@Z
      - DB_NAME=inventario
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "start"]
  frontend:
    build: ./frontend
    container_name: inventario-frontend
    platform: linux/amd64
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql_inventario
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 5432SE#@Z
      MYSQL_DATABASE: inventario
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

